[project]
name = "agentseg"
version = "0.1.0"
description = "Video segmentation labeling with a coding agent driving SAM 3"
readme = "README.md"
requires-python = ">=3.12.0, <3.13"
dependencies = [
    "numpy>=1.26.0,<2",
    "pillow>=10.0.0",
    "opencv-python>=4.8.0",
    "scipy",
    "pycocotools>=2.0.0",
    "httpx>=0.27",

    # Backend
    "fastapi>=0.104.0",
    "uvicorn[standard]>=0.24.0",
    "pydantic>=2.0.0",

    # DINOv3 track health checks (loaded via torch.hub from third_party/dinov3)
    "torch>=2.7.0",
    "torchvision>=0.22.0",
    "torchmetrics",
    "omegaconf",
    "termcolor",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
]

[project.scripts]
agentseg = "cli.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.hatch.build.targets.wheel]
packages = ["backend", "core", "ml", "cli"]
